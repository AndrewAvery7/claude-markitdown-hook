name: Bug report
description: Something the hook did, or failed to do
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Before filing, [docs/TROUBLESHOOTING.md](../blob/main/docs/TROUBLESHOOTING.md)
        covers the two most common causes: the wrong Python interpreter, and a
        `markitdown` installed without the `[pdf]` extra.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did the hook do, and what did you expect instead?
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Which of these fits best?
      options:
        - The hook did nothing at all
        - A usable document was rejected as image-based
        - An unusable document was reported as converted
        - The conversion was wrong or incomplete
        - Something else
    validations:
      required: true

  - type: textarea
    id: hook-output
    attributes:
      label: Hook output
      description: >
        Run the hook by hand and paste the result. Replace the path with your
        document. Redact anything sensitive — file names are enough.
      value: |
        ```
        $ echo '{"prompt":"read \"/path/to/doc.pdf\"","cwd":"/tmp"}' | python3 /path/to/markitdown_hook.py

        ```
      render: shell

  - type: textarea
    id: density
    attributes:
      label: Characters per page
      description: >
        For any grading issue this is the single most useful number. The recipe
        is in docs/TROUBLESHOOTING.md under "A document I know has text is
        rejected".
      placeholder: "e.g. 1240 chars over 3 pages = 413 per page"

  - type: input
    id: versions
    attributes:
      label: Versions
      description: OS, Python, markitdown, and how markitdown was installed
      placeholder: "macOS 15, Python 3.12 (venv), markitdown 0.1.6 via pip install 'markitdown[all]'"
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How is the hook installed?
      options:
        - Claude Code plugin
        - Manually via settings.json
    validations:
      required: true

  - type: textarea
    id: document
    attributes:
      label: About the document
      description: >
        Please do not attach confidential files. Its type, rough size, page
        count, and how it was produced (scanned, exported from a browser,
        generated by a tool) is usually enough to reproduce.
